name: fullscreen_clock
description: "全屏时钟 Fullscreen Clock"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.7.0
  window_manager: ^0.5.2
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 附带第三方字体官方许可协议(随应用打包,满足字体许可的保留要求)
  assets:
    - assets/fonts/HarmonyOS_Sans/LICENSE
    - assets/fonts/MiSans/LICENSE
  fonts:
    - family: HarmonyOS Sans
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans/HarmonyOS_Sans_Thin.ttf
          weight: 100
        - asset: assets/fonts/HarmonyOS_Sans/HarmonyOS_Sans_Light.ttf
          weight: 300
        - asset: assets/fonts/HarmonyOS_Sans/HarmonyOS_Sans_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_Sans/HarmonyOS_Sans_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans/HarmonyOS_Sans_Bold.ttf
          weight: 700
        - asset: assets/fonts/HarmonyOS_Sans/HarmonyOS_Sans_Black.ttf
          weight: 900
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans/MiSansLatin-Thin.ttf
          weight: 100
        - asset: assets/fonts/MiSans/MiSansLatin-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/MiSans/MiSansLatin-Light.ttf
          weight: 300
        - asset: assets/fonts/MiSans/MiSansLatin-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans/MiSansLatin-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans/MiSansLatin-Demibold.ttf
          weight: 600
        - asset: assets/fonts/MiSans/MiSansLatin-Bold.ttf
          weight: 700
        - asset: assets/fonts/MiSans/MiSansLatin-Heavy.ttf
          weight: 900
